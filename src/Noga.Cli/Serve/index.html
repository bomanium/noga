<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{product}}</title>
<style>
{{statusCss}}
:root { color-scheme: light dark; --fg: #1b1b1b; --muted: #5f5f5f; --bg: #f6f6f4; --panel: #fff; --line: #ddd; --faint: #eee; --hover: #f3f7fb;
  --input: #fff; --input-line: #bbb; --accent: #2f6fa8; --accent-line: #2f5f8f; --accent-text: #2f5f8f; --link: #1f5d99; }
@media (prefers-color-scheme: dark) { :root { --fg: #e6e6e3; --muted: #a6a6a1; --bg: #121211; --panel: #1c1c1b; --line: #3a3a38;
  --faint: #2a2a28; --hover: #23272c; --input: #121211; --input-line: #4a4a48; --accent: #2f6fa8; --accent-line: #5b8fc4;
  --accent-text: #8cbcf0; --link: #8cbcf0; } }
body { font: 15px/1.45 system-ui, sans-serif; margin: 0; color: var(--fg); background: var(--bg); }
a { color: var(--link); }
header { padding: .8rem 1.2rem; background: #1f2a36; color: #fff; display: flex; align-items: baseline; gap: .8rem; }
header h1 { font-size: 1.15rem; margin: 0; }
header span { color: #b8c4d0; font-size: .85rem; }
main { display: grid; grid-template-columns: minmax(20rem, 1fr) minmax(24rem, 1.4fr); gap: 1rem; padding: 1rem 1.2rem; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: .4rem; padding: .8rem 1rem; min-width: 0; }
h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 .6rem; }
form { display: flex; gap: .4rem; margin-bottom: .6rem; }
input[type=text] { flex: 1; font: inherit; padding: .3rem .5rem; border: 1px solid var(--input-line); border-radius: .25rem; min-width: 0; background: var(--input); color: var(--fg); }
button { font: inherit; padding: .3rem .8rem; border: 1px solid var(--accent-line); background: var(--accent); color: #fff; border-radius: .25rem; cursor: pointer; }
button.quiet { background: var(--panel); color: var(--accent-text); }
button:disabled { opacity: .5; cursor: default; }
ul { list-style: none; margin: 0; padding: 0; }
#entries { max-height: 65vh; overflow: auto; border-top: 1px solid var(--faint); }
#entries li { display: flex; align-items: center; gap: .5rem; padding: .25rem .3rem; border-bottom: 1px solid var(--faint); }
#entries li:hover { background: var(--hover); }
#entries .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#entries button.link { font: inherit; text-align: left; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; }
#entries button.link:hover { text-decoration: underline; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
#all { margin-bottom: .6rem; }
#entries .folder .name::before { content: "\1F4C1  "; }
#entries .other .name { color: var(--muted); }
#entries .size { color: var(--muted); font-size: .8rem; white-space: nowrap; }
#entries li button { padding: .1rem .6rem; font-size: .85rem; }
#jobs li { border-bottom: 1px solid var(--faint); padding: .5rem .2rem; display: grid; grid-template-columns: 10.5rem 1fr auto; gap: .2rem .7rem; align-items: baseline; }
#jobs .file { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#jobs .where { grid-column: 2 / 4; color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#jobs .links { white-space: nowrap; }
#jobs .links a { margin-left: .6rem; font-size: .9rem; }
#jobs .links a.open { background: var(--accent); color: #fff; border: 1px solid var(--accent-line); padding: .05rem .6rem; border-radius: .25rem; text-decoration: none; }
#jobs .links a.json { color: var(--muted); font-size: .8rem; }
#jobs .reason { grid-column: 2 / 4; font-size: .85rem; }
.state { justify-self: start; padding: .1rem .45rem; border-radius: .25rem; font-size: .8rem; font-weight: 600; white-space: nowrap; }
.error { color: var(--failure); font-size: .85rem; grid-column: 2 / 4; }
.empty { color: var(--muted); padding: .6rem .2rem; }
#watching { margin: 1rem 1.2rem 0; padding: .5rem .8rem; background: var(--info-bg); color: var(--info); border-radius: .3rem; font-size: .9rem; }
#watching:empty, #watching[data-folder=""] { display: none; }
#problem { color: var(--failure); min-height: 1.2em; font-size: .85rem; }
@media (max-width: 52rem) { main { grid-template-columns: 1fr; } }
@media (max-width: 36rem) { #jobs li { grid-template-columns: 1fr auto; } #jobs .file { grid-column: 1 / 3; grid-row: 2; } #jobs .where, #jobs .reason, .error { grid-column: 1 / 3; } }
</style>
</head>
<body>
<header><h1>{{product}}</h1><span>{{version}} · profile {{profile}}</span></header>
<div id="watching" data-folder="{{watched}}">Watching <b>{{watched}}</b>: its media files without a report are checked, new ones once their copy has finished.</div>
<main>
  <section>
    <h2>Pick a file on this machine</h2>
    <form id="go">
      <input type="text" id="path" aria-label="Folder or file path" spellcheck="false">
      <button type="submit" class="quiet">Open</button>
    </form>
    <div id="problem" role="alert"></div>
    <button type="button" id="all" class="quiet" hidden></button>
    <ul id="entries"></ul>
  </section>
  <section>
    <h2>Checks</h2>
    <ul id="jobs"><li class="empty">None yet: pick a file and press Check. Its reports are written beside it.</li></ul>
  </section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const headers = { "Content-Type": "application/json", "X-Noga": "1" };
let parent = null;

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  for (const child of children) node.append(child);
  return node;
}

function size(bytes) {
  const units = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (bytes >= 1000 && i < units.length - 1) { bytes /= 1000; i++; }
  return (i ? bytes.toFixed(1) : bytes) + " " + units[i];
}

async function open(path) {
  const response = await fetch(path ? "/api/folders?path=" + encodeURIComponent(path) : "/api/folders");
  if (!response.ok) {
    // The folder before stays out of sight, or it would read as this one's (empty) listing.
    const problem = await response.json().catch(() => ({}));
    $("problem").textContent = problem.detail ?? "Can't open " + path;
    $("entries").replaceChildren();
    $("all").hidden = true;
    return;
  }
  const listing = await response.json();
  $("problem").textContent = "";
  $("path").value = listing.path ?? "";
  parent = listing.parent;
  const items = [];
  if (parent !== null && parent !== undefined)
    items.push(row({ name: "..", path: parent, isFolder: true }));
  for (const entry of listing.entries) items.push(row(entry));
  if (!listing.entries.length) items.push(el("li", { className: "empty", textContent: "Empty folder" }));
  $("entries").replaceChildren(...items);
  media = listing.entries.filter(e => e.isMedia).map(e => e.path);
  $("all").hidden = media.length < 2;
  $("all").textContent = `Check all ${media.length} media files here`;
  mark();
}

// The media files listed, which "Check all" queues.
let media = [];

function row(entry) {
  if (entry.isFolder) {
    // A button, so the keyboard reaches it (Tab, then Enter).
    const name = el("button", { type: "button", className: "name link", textContent: entry.name, title: entry.path });
    name.addEventListener("click", () => open(entry.path));
    return el("li", { className: "folder" }, name);
  }
  const li = el("li", { className: entry.isMedia ? "media" : "other" },
    el("span", { className: "name", textContent: entry.name, title: entry.path }),
    el("span", { className: "size", textContent: size(entry.size) }));
  // Only media files are checked; the others are listed so the folder reads as it is.
  if (entry.isMedia) {
    const button = el("button", { type: "button", textContent: "Check" });
    button.dataset.path = entry.path;
    button.addEventListener("click", () => check(entry.path));
    li.append(button);
  }
  return li;
}

async function check(path) {
  waiting.add(path);
  mark();
  const response = await fetch("/api/jobs", { method: "POST", headers, body: JSON.stringify({ path }) });
  if (!response.ok) {
    waiting.delete(path);
    mark();
    const problem = await response.json().catch(() => ({}));
    $("problem").textContent = problem.detail ?? "Can't check " + path;
  }
}

// Files asked for whose job hasn't come back in the events yet.
const waiting = new Set();

// Each listed file's Check button says when the file is queued or measuring, and can't queue it twice.
function mark() {
  const active = new Map(latest.filter(j => j.state === "Queued" || j.state === "Measuring").map(j => [j.file, j.status]));
  for (const path of latest.map(j => j.file)) waiting.delete(path);
  for (const button of document.querySelectorAll("#entries button[data-path]")) {
    const path = button.dataset.path;
    const status = active.get(path) ?? (waiting.has(path) ? "Queued" : null);
    button.disabled = status !== null;
    button.textContent = status ? statuses[status][0] : "Check";
  }
}

// Each status's label and tone, as the report and the app show them (StatusStyle).
const statuses = {{statuses}};

function show(jobs) {
  if (!jobs.length) return;
  $("jobs").replaceChildren(...jobs.map(job => {
    const state = job.state.toLowerCase();
    const [label, tone] = statuses[job.status];
    const file = job.file.split(/[\\/]/).pop();
    const links = el("span", { className: "links" });
    if (state === "done") {
      links.append(el("a", { className: "open", href: `/api/jobs/${job.id}/report.html`, target: "_blank", rel: "noopener", textContent: "Report" }));
      links.append(el("a", { className: "json", href: `/api/jobs/${job.id}/report.json`, target: "_blank", rel: "noopener", textContent: "JSON" }));
    }
    // How long it has been measuring or took, then the folder (the name is above it): the time first, so a long
    // folder cut off at the end doesn't hide it.
    const time = job.started ? (state === "measuring" ? "measuring " + elapsed(job.started) : "took " + elapsed(job.started, job.finished)) + " · " : "";
    const li = el("li", {},
      el("span", { className: "state " + tone, textContent: label }),
      el("span", { className: "file", textContent: file, title: job.file }),
      links,
      el("span", { className: "where", textContent: time + job.folder, title: job.file }));
    if (job.reason) li.append(el("span", { className: "reason", textContent: job.reason }));
    if (job.shortError) li.append(el("span", { className: "error", textContent: job.shortError }));
    return li;
  }));
}

// As Job.Format: "12 s", "3 min 05 s".
function elapsed(since, until) {
  const seconds = Math.max(0, Math.round(((until ? Date.parse(until) : Date.now()) - Date.parse(since)) / 1000));
  return seconds < 60 ? seconds + " s" : Math.floor(seconds / 60) + " min " + String(seconds % 60).padStart(2, "0") + " s";
}

let latest = [];
const events = new EventSource("/api/events");
events.onmessage = message => { latest = JSON.parse(message.data); show(latest); mark(); };
setInterval(() => { if (latest.some(j => j.state === "Measuring")) show(latest); }, 1000);

$("all").addEventListener("click", () => { for (const path of media) check(path); });
$("go").addEventListener("submit", event => { event.preventDefault(); open($("path").value); });
open($("watching").dataset.folder || null);
</script>
</body>
</html>
