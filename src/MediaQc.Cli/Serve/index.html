<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{product}}</title>
<style>
body { font: 15px/1.45 system-ui, sans-serif; margin: 0; color: #1b1b1b; background: #f6f6f4; }
header { padding: .8rem 1.2rem; background: #1f2a36; color: #fff; display: flex; align-items: baseline; gap: .8rem; }
header h1 { font-size: 1.15rem; margin: 0; }
header span { color: #b8c4d0; font-size: .85rem; }
main { display: grid; grid-template-columns: minmax(20rem, 1fr) minmax(24rem, 1.4fr); gap: 1rem; padding: 1rem 1.2rem; }
section { background: #fff; border: 1px solid #ddd; border-radius: .4rem; padding: .8rem 1rem; min-width: 0; }
h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: #555; margin: 0 0 .6rem; }
form { display: flex; gap: .4rem; margin-bottom: .6rem; }
input[type=text] { flex: 1; font: inherit; padding: .3rem .5rem; border: 1px solid #bbb; border-radius: .25rem; min-width: 0; }
button { font: inherit; padding: .3rem .8rem; border: 1px solid #2f5f8f; background: #2f6fa8; color: #fff; border-radius: .25rem; cursor: pointer; }
button.quiet { background: #fff; color: #2f5f8f; }
button:disabled { opacity: .5; cursor: default; }
ul { list-style: none; margin: 0; padding: 0; }
#entries { max-height: 65vh; overflow: auto; border-top: 1px solid #eee; }
#entries li { display: flex; align-items: center; gap: .5rem; padding: .25rem .3rem; border-bottom: 1px solid #f0f0f0; }
#entries li:hover { background: #f3f7fb; }
#entries .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
#entries .folder .name::before { content: "\1F4C1  "; }
#entries .other .name { color: #999; }
#entries .size { color: #777; font-size: .8rem; white-space: nowrap; }
#entries li button { padding: .1rem .6rem; font-size: .85rem; }
#jobs li { border-bottom: 1px solid #eee; padding: .5rem .2rem; display: grid; grid-template-columns: auto 1fr auto; gap: .2rem .7rem; align-items: baseline; }
#jobs .file { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#jobs .where { grid-column: 2 / 4; color: #777; font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#jobs .links a { margin-left: .6rem; font-size: .9rem; }
.state { padding: .1rem .45rem; border-radius: .25rem; font-size: .8rem; font-weight: 600; white-space: nowrap; }
.queued { background: #eee; color: #555; }
.measuring { background: #e8eef7; color: #24466e; }
.pass { background: #e3f4e6; color: #17602a; }
.warning { background: #fdf1d6; color: #7a5200; }
.failure, .failed { background: #fbe3e1; color: #8d1c12; }
.error { color: #8d1c12; font-size: .85rem; grid-column: 2 / 4; }
.empty { color: #777; padding: .6rem .2rem; }
#watching { margin: 1rem 1.2rem 0; padding: .5rem .8rem; background: #e8eef7; color: #24466e; border-radius: .3rem; font-size: .9rem; }
#watching:empty, #watching[data-folder=""] { display: none; }
#problem { color: #8d1c12; min-height: 1.2em; font-size: .85rem; }
@media (max-width: 52rem) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><h1>{{product}}</h1><span>{{version}} · file-based QC · this machine only</span></header>
<div id="watching" data-folder="{{watched}}">Watching <b>{{watched}}</b>: its media files without a report are checked, new ones once their copy has finished.</div>
<main>
  <section>
    <h2>Pick a file on this machine</h2>
    <form id="go">
      <input type="text" id="path" aria-label="Folder or file path" spellcheck="false">
      <button type="submit" class="quiet">Open</button>
    </form>
    <div id="problem"></div>
    <ul id="entries"></ul>
  </section>
  <section>
    <h2>Checks</h2>
    <ul id="jobs"><li class="empty">None yet: pick a file and press Check. Its reports are written beside it.</li></ul>
  </section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const headers = { "Content-Type": "application/json", "X-MediaQc": "1" };
let parent = null;

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  for (const child of children) node.append(child);
  return node;
}

function size(bytes) {
  const units = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (bytes >= 1000 && i < units.length - 1) { bytes /= 1000; i++; }
  return (i ? bytes.toFixed(1) : bytes) + " " + units[i];
}

async function open(path) {
  const response = await fetch(path ? "/api/folders?path=" + encodeURIComponent(path) : "/api/folders");
  if (!response.ok) {
    const problem = await response.json().catch(() => ({}));
    $("problem").textContent = problem.detail ?? "Can't open " + path;
    return;
  }
  const listing = await response.json();
  $("problem").textContent = "";
  $("path").value = listing.path ?? "";
  parent = listing.parent;
  const items = [];
  if (parent !== null && parent !== undefined)
    items.push(row({ name: "..", path: parent, isFolder: true }));
  for (const entry of listing.entries) items.push(row(entry));
  if (!listing.entries.length) items.push(el("li", { className: "empty", textContent: "Empty folder" }));
  $("entries").replaceChildren(...items);
}

function row(entry) {
  const name = el("span", { className: "name", textContent: entry.name, title: entry.path });
  const li = el("li", { className: entry.isFolder ? "folder" : entry.isMedia ? "media" : "other" }, name);
  if (entry.isFolder) {
    name.addEventListener("click", () => open(entry.path));
  } else {
    li.append(el("span", { className: "size", textContent: size(entry.size) }));
    const button = el("button", { type: "button", textContent: "Check" });
    button.addEventListener("click", () => check(entry.path));
    li.append(button);
  }
  return li;
}

async function check(path) {
  const response = await fetch("/api/jobs", { method: "POST", headers, body: JSON.stringify({ path }) });
  if (!response.ok) {
    const problem = await response.json().catch(() => ({}));
    $("problem").textContent = problem.detail ?? "Can't check " + path;
  }
}

const labels = { queued: "Queued", measuring: "Measuring…", failed: "Couldn't read" };
const verdicts = { pass: "Passed", info: "Passed", warning: "Warnings", failure: "Failed" };

function show(jobs) {
  if (!jobs.length) return;
  $("jobs").replaceChildren(...jobs.map(job => {
    const state = job.state.toLowerCase();
    const verdict = job.verdict?.toLowerCase();
    const label = state === "done" ? verdicts[verdict] : labels[state];
    const css = state === "done" ? (verdict === "info" ? "pass" : verdict) : state;
    const file = job.file.split(/[\\/]/).pop();
    const links = el("span", { className: "links" });
    if (state === "done") {
      links.append(el("a", { href: `/api/jobs/${job.id}/report.html`, target: "_blank", rel: "noopener", textContent: "Report" }));
      links.append(el("a", { href: `/api/jobs/${job.id}/report.json`, target: "_blank", rel: "noopener", textContent: "JSON" }));
    } else if (state === "measuring" && job.started) {
      links.append(el("span", { className: "size", textContent: elapsed(job.started) }));
    }
    const li = el("li", {},
      el("span", { className: "state " + css, textContent: label }),
      el("span", { className: "file", textContent: file, title: job.file }),
      links,
      el("span", { className: "where", textContent: job.file }));
    if (job.error) li.append(el("span", { className: "error", textContent: job.error }));
    return li;
  }));
}

function elapsed(since) {
  const seconds = Math.max(0, Math.round((Date.now() - Date.parse(since)) / 1000));
  return seconds < 60 ? seconds + " s" : Math.floor(seconds / 60) + " min " + (seconds % 60) + " s";
}

let latest = [];
const events = new EventSource("/api/events");
events.onmessage = message => { latest = JSON.parse(message.data); show(latest); };
setInterval(() => { if (latest.some(j => j.state === "Measuring")) show(latest); }, 1000);

$("go").addEventListener("submit", event => { event.preventDefault(); open($("path").value); });
open($("watching").dataset.folder || null);
</script>
</body>
</html>
