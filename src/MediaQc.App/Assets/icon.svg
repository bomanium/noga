<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- mediaqc-app's icon: a check mark cut out of the seven 75 % colour bars, on a dark tile.
       Drawn by hand, no fonts or third-party artwork (docs/decisions/2026-11-02-app-icon.md).
       The source for every size: the window icon, the Windows .ico and the Linux icons are made from this file. -->
  <title>mediaqc-app</title>
  <defs>
    <clipPath id="tick">
      <polygon points="33.6,142.4 70.4,105.6 104,139.2 187.6,55.6 224.4,92.4 104,212.8"/>
    </clipPath>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="48" fill="#1d2330" stroke="#46506a" stroke-width="4"/>
  <g clip-path="url(#tick)">
    <rect x="33.6" y="40" width="27.86" height="190" fill="#d8d8d8"/>
    <rect x="60.86" y="40" width="27.86" height="190" fill="#e0d000"/>
    <rect x="88.12" y="40" width="27.86" height="190" fill="#00c8d8"/>
    <rect x="115.38" y="40" width="27.86" height="190" fill="#20c040"/>
    <rect x="142.64" y="40" width="27.86" height="190" fill="#c838c8"/>
    <rect x="169.9" y="40" width="27.86" height="190" fill="#e03030"/>
    <rect x="197.16" y="40" width="27.86" height="190" fill="#3060ff"/>
  </g>
</svg>
