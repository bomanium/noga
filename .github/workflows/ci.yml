name: CI

on:
  push:
    branches: [main]
    # A version tag (v0.1.0-alpha.1) also publishes a release: the release job below
    # (docs/decisions/2026-11-01-release-workflow.md).
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]   # drafts run nothing until marked ready

# A new push to a pull request supersedes its running checks; pushes to main all run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The token only reads the repository.
permissions:
  contents: read

jobs:
  # Ubuntu only: this repository is private, and its Actions minutes cost 2x on Windows and 10x on macOS. The runner
  # is pinned to an image version, as in the owner's other repositories, so it can't change under CI unannounced.
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A tag names the version it releases: v and Directory.Build.props' Version, or nothing is released
      # (checked first, before the long steps).
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::Tag $GITHUB_REF_NAME isn't v$version (Directory.Build.props)"; exit 1; }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      # The tests compare the measures with the ffmpeg command line (CLAUDE.md: every figure is checked against
      # FFmpeg). Ubuntu's build is a tool here, never shipped (docs/dependencies.md).
      - name: ffmpeg
        run: |
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg; }
          ffmpeg -hide_banner -version | head -1

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore MediaQc.slnx

      - name: Format (StyleBro)
        run: dotnet tool run bro format MediaQc.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MediaQc.slnx -c Release --no-restore -warnaserror

      # make-samples.sh's programme as ProRes, DNxHR and H.264 (~45 s, ~480 MB); the tests check each against ffmpeg.
      - name: Samples
        run: tools/make-samples.sh samples

      - name: Test
        run: dotnet test MediaQc.slnx -c Release --no-build --logger GitHubActions

      # The release folders and archives for Linux and Windows, with their licences (tools/publish.sh checks them),
      # then the Linux one run on a sample: it exits 1, as the sample fails loudness on purpose.
      - name: Publish
        run: |
          tools/publish.sh
          code=0; artifacts/mediaqc-*-linux-x64/mediaqc check samples/programme_prores.mov --out "$RUNNER_TEMP" || code=$?
          test "$code" -eq 1

      - name: make-samples.sh parses
        run: bash -n tools/make-samples.sh

      - name: Keep the archives
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
          if-no-files-found: error
          retention-days: 7

  # The archives the build made and tested, on a GitHub release published at once; a pre-release when the version has
  # a suffix (-alpha.1). The only job that writes to the repository.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: release

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "mediaqc ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag "${prerelease[@]}"
